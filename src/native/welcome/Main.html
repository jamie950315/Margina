<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self'; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'none'">
  <title>Margina</title>
  <link rel="icon" href="../Icon.png">
  <link rel="stylesheet" href="../Style.css">
  <script src="../Script.js" defer></script>
</head>
<body>
  <main>
    <header>
      <img src="../Icon.png" width="44" height="44" alt="">
      <div>
        <p class="app-name">Margina <span>Safari 擴充功能 · 內建中轉</span></p>
        <h1>讓 ChatGPT 留在閱讀旁邊</h1>
      </div>
    </header>
    <p id="extension-status" class="extension-status" role="status" aria-live="polite" aria-atomic="true" data-state="unknown"><span class="status-dot" aria-hidden="true"></span><span class="status-text">尚未確認擴充功能狀態，可到 Safari 設定中查看。</span></p>
    <ol class="steps" aria-label="開始使用">
      <li><span class="step-number" aria-hidden="true">1</span><span>在 Safari <span class="settings-name">設定</span>中啟用 Margina 擴充功能</span></li>
      <li><span class="step-number" aria-hidden="true">2</span><span>開啟網頁側欄，選擇 ChatGPT</span></li>
      <li><span class="step-number" aria-hidden="true">3</span><span>第一次使用時，在官方視窗登入帳號</span></li>
    </ol>
    <p class="account-note">登入資訊只保存在這台 Mac 的鑰匙圈，關閉 Safari 後仍可沿用。可在擴充功能登出或切換帳號；登入到期時可能需要重新登入。</p>
    <button type="button" class="open-preferences">開啟 Safari 擴充功能設定</button>
  </main>
</body>
</html>
