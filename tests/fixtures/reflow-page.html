<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SafAI 並排版面測試</title>
<style>
  body { margin: 0; background: #edf2f8; color: #14263c; font: 18px/1.6 system-ui; }
  header { position: fixed; top: 0; left: 0; right: 0; width: 100vw; box-sizing: border-box; padding: 16px; background: #163e64; color: white; display: flex; justify-content: space-between; z-index: 2; }
  main { padding: 100px 24px 30px; display: grid; grid-template-columns: minmax(0,2fr) minmax(0,1fr); gap: 24px; }
  article, aside { padding: 24px; border-radius: 16px; background: white; min-width: 0; }
  .centered { position: fixed; left: 50%; transform: translateX(-50%); bottom: 28px; width: 600px; box-sizing: border-box; background: #d6eadb; border: 2px solid #357448; padding: 12px; z-index: 3; }
  button { font: inherit; padding: 8px; }
  .space { height: 900px; }
  @media (min-width: 1200px) { main { grid-template-columns: 900px minmax(0,1fr); } }
</style>
<body>
<header><span>固定導覽列</span><span>右側內容必須可見 ✓</span></header>
<main><article><h1>網頁與 SafAI 並排</h1><p>開啟側欄後，兩欄內容應縮窄，右側文字不可被遮住。關閉後恢復。</p><button>框選測試按鈕</button><p id="metrics"></p><div class="space"></div><p>捲動到底仍可看到固定導覽列。</p></article><aside><h2>右側資訊</h2><p>這個區塊應完整留在側欄左邊。</p></aside></main>
<div class="centered">置中浮動視窗：左右邊界都應留在網頁範圍內。</div>
<script>
setInterval(() => {
  const root = document.documentElement;
  const reserved = parseFloat(root.style.getPropertyValue('--safai-extension-panel-width')) || 0;
  const available = innerWidth - reserved;
  const elements = [document.querySelector('header'), document.querySelector('aside'), document.querySelector('.centered')];
  const fits = elements.every(el => { const r = el.getBoundingClientRect(); return r.left >= -1 && r.right <= available + 1; });
  const text = `版面檢查：${fits ? '通過' : '超出範圍'}｜網頁 ${Math.round(root.getBoundingClientRect().width)}｜可用 ${available}`;
  if (document.querySelector('#metrics').textContent !== text) document.querySelector('#metrics').textContent = text;
}, 500);
</script>
</body>
</html>
