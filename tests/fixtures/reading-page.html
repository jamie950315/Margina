<!doctype html>
<html lang="zh-Hant">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SafAI 閱讀與截圖測試</title>
  <style>
    body { margin: 48px auto; max-width: 720px; padding: 0 24px; font: 18px/1.8 -apple-system, sans-serif; background: #f5f5f7; color: #1d1d1f; }
    article { background: white; border-radius: 20px; padding: 32px; }
    button { padding: 12px 24px; background: #007aff; color: white; border: 0; border-radius: 12px; font: inherit; }
  </style>
  <article>
    <h1>讓閱讀保持專注</h1>
    <p>這是 SafAI 的本機測試頁面，不包含個人資料，也不會向外傳送內容。</p>
    <p>側欄應該配合閱讀，而不是搶走注意力。清楚的文字、適當的留白和必要時才出現的控制，能讓理解內容更輕鬆。</p>
    <h2>驗證項目</h2>
    <ul>
      <li>開啟、關閉與調整側欄寬度。</li>
      <li>反白文字後，確認側欄只附上選取內容。</li>
      <li>擷取目前畫面，或框選下方按鈕。</li>
      <li>預覽並移除附件，不需傳送到 API。</li>
    </ul>
    <button type="button">框選這個按鈕</button>
  </article>
</html>
